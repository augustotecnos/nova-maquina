# Preferências do GNOME. Aplicado com: dconf load / < preferencias.ini
# O @HOME@ é trocado pelo diretório do usuário na hora de aplicar.

[org/gnome/desktop/interface]
color-scheme='prefer-dark'
gtk-theme='Yaru-dark'
icon-theme='Yaru-dark'
font-name='Ubuntu Sans 11'
cursor-size=48

[org/gnome/desktop/wm/keybindings]
# Super+H fica livre para o ditado; Super+Up/Down não roubam o teclado.
minimize=@as []
maximize=@as []
unmaximize=@as []

[org/gnome/mutter]
edge-tiling=false
experimental-features=['scale-monitor-framebuffer', 'xwayland-native-scaling']

[org/gnome/mutter/keybindings]
toggle-tiled-left=@as []
toggle-tiled-right=@as []

[org/gnome/shell]
favorite-apps=['org.gnome.Nautilus.desktop', 'google-chrome.desktop', 'microsoft-edge.desktop', 'firefox_firefox.desktop', 'com.brave.Browser.desktop', 'snap-store_snap-store.desktop', 'code.desktop', 'org.gnome.Ptyxis.desktop', 'org.gnome.TextEditor.desktop', 'com.github.dail8859.NotepadNext.desktop']

[org/gnome/settings-daemon/plugins/media-keys]
# O ocr-tela e o colar-avancado registram os seus próprios na instalação;
# os caminhos ficam listados aqui para a lista não ser sobrescrita depois.
custom-keybindings=['/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/ditado/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/ulauncher/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/ocr-tela/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/colar-avancado/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/colar-avancado-texto/']

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/ditado]
name='Ditado por voz'
command='@HOME@/.local/bin/ditado'
binding='<Super>h'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/ulauncher]
name='Ulauncher'
command='/usr/bin/ulauncher-toggle'
binding='<Primary>space'

[org/gnome/nautilus/preferences]
default-folder-viewer='list-view'

[org/gtk/settings/file-chooser]
sort-directories-first=true
